<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Sitio Web</title>  
  <!-- Carga del SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    
    .modal {
      display: none; 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff; padding: 20px; border-radius: 8px; width: 300px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Navegación y Botón -->
  <header>
    <h1>Bienvenido a mi sitio web</h1>
    <div id="user-section">
      <button id="open-auth-btn" onclick="openModal()">Iniciar Sesión / Registrarse</button>
      <div id="user-info" class="hidden">
        <span id="user-email"></span>
        <button onclick="logout()">Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <main>
    <p>Este es el contenido público de tu página web visible para cualquier visitante.</p>
  </main>

  <!-- Modal de Autenticación -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Iniciar Sesión</h2>
      
      <form id="auth-form">
        <input type="email" id="email" placeholder="Correo electrónico" required style="width: 100%; margin-bottom: 10px; box-sizing: border-box;">
        <input type="password" id="password" placeholder="Contraseña" required style="width: 100%; margin-bottom: 10px; box-sizing: border-box;">
        
        <button type="submit" id="submit-btn" style="width: 100%;">Entrar</button>
      </form>

      <p style="margin-top: 15px; font-size: 0.9em;">
        <span id="toggle-text">¿No tienes cuenta?</span> 
        <a href="#" id="toggle-link" onclick="toggleAuthMode(event)">Regístrate aquí</a>
      </p>
      
      <button onclick="closeModal()" style="margin-top: 10px; width: 100%;">Cancelar</button>
    </div>
  </div>

  <script>
    // 1. Inicialización ÚNICA de Supabase
    const SUPABASE_URL = "https://jsigzhopcdlreblorjhe.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_270tyeyHmNZnVfSMUkt-DA_DqCxn4fY"; 

    // Solo declaramos supabase una vez
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignUp = false;

    // 2. Funciones globales para controlar el Modal
    function openModal() {
      document.getElementById('auth-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('auth-modal').style.display = 'none';
    }

    function toggleAuthMode(e) {
      e.preventDefault();
      isSignUp = !isSignUp;
      document.getElementById('modal-title').innerText = isSignUp ? "Crear Cuenta" : "Iniciar Sesión";
      document.getElementById('submit-btn').innerText = isSignUp ? "Registrarse" : "Entrar";
      document.getElementById('toggle-text').innerText = isSignUp ? "¿Ya tienes cuenta?" : "¿No tienes cuenta?";
      document.getElementById('toggle-link').innerText = isSignUp ? "Inicia sesión" : "Regístrate aquí";
    }

    // 3. Formulario e inicio de sesión
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (isSignUp) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) {
          alert("Error: " + error.message);
        } else {
          alert("Registro exitoso.");
          closeModal();
          checkUser();
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          alert("Error: " + error.message);
        } else {
          closeModal();
          checkUser();
        }
      }
    });

    // 4. Cerrar sesión
    async function logout() {
      await supabaseClient.auth.signOut();
      checkUser();
    }

    // 5. Verificar estado del usuario
    async function checkUser() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      const openBtn = document.getElementById('open-auth-btn');
      const userInfo = document.getElementById('user-info');
      const userEmail = document.getElementById('user-email');

      if (user) {
        openBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userEmail.innerText = `Hola, ${user.email} `;
      } else {
        openBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
      }
    }

    checkUser();
  </script>
</body>
</html>
